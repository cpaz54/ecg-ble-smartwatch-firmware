CONFIG_LOG=y
# Choose a log backend. Common options: console (prints to UART console),
# SEGGER_RTT (requires Segger J-Link and RTT support), or printk.
# Enable the console backend which prints to the configured console device.
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_RTT=y

# Optionally enable SEGGER RTT backend if using J-Link/RTT
# CONFIG_SEGGER_RTT=y

# Ensure printk support is available if using printk-based logging
CONFIG_PRINTK=y

# Default log level. LOG_ERR will be printed at level ERR and above. Set to
# INFO or DBG for more verbosity during development.
CONFIG_LOG_DEFAULT_LEVEL=3
# CONFIG_MAIN_STACK_SIZE=4096

CONFIG_SMF=y
CONFIG_EVENTS=y
CONFIG_ADC=y
CONFIG_ADC_ASYNC=y
CONFIG_PWM=y
CONFIG_SENSOR=y

CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_DEBUG_THREAD_INFO=y

CONFIG_BT=y
CONFIG_BT_SMP=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=n
CONFIG_BT_BAS=y
CONFIG_BT_HRS=y
CONFIG_BT_DEVICE_NAME="Carson's Heart Rate Monitor"
CONFIG_BT_DEVICE_APPEARANCE=833